<script>
let allCircolari = [];
let filteredCircolari = [];
let currentPage = 1;
const itemsPerPage = 10;

async function loadArchive() {
    const loader = document.getElementById('loader');

    try {
        const response = await fetch('circolari.json');
        if (!response.ok) throw new Error("File JSON non trovato.");
        
        const jsonData = await response.json();
        
        // Gestione della nuova struttura con metadati e timestamp
        if (Array.isArray(jsonData)) {
            allCircolari = jsonData; // Retrocompatibilità se il file fosse una lista
        } else {
            allCircolari = jsonData.circolari || [];
            if (jsonData.ultimo_aggiornamento) {
                document.getElementById('lastUpdate').textContent = jsonData.ultimo_aggiornamento;
            }
        }

        loader.style.display = 'none';
        
        populateYearDropdown();
        applyFilters();
    } catch (error) {
        loader.innerHTML = '<p class="error-msg">File circolari.json non trovato. Esegui lo script Python in locale per generarlo.</p>';
    }
}

function initClock() {
    // Orologio in tempo reale
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('it-IT');
    }, 1000);
}

function populateYearDropdown() {
    const yearSelect = document.getElementById('yearSelect');
    const years = new Set();

    allCircolari.forEach(item => {
        if (item.pubDate) {
            const year = new Date(item.pubDate).getFullYear();
            if (!isNaN(year)) years.add(year);
        }
    });

    const sortedYears = Array.from(years).sort((a, b) => b - a);
    sortedYears.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
    });
}

function onFilterChange() {
    currentPage = 1;
    applyFilters();
}

function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedYear = document.getElementById('yearSelect').value;
    const selectedMonth = document.getElementById('monthSelect').value;
    const sortOrder = document.getElementById('sortSelect').value;

    filteredCircolari = allCircolari.filter(item => {
        const date = item.pubDate ? new Date(item.pubDate) : null;
        
        const matchesQuery = !query || 
            item.title.toLowerCase().includes(query) || 
            item.description.toLowerCase().includes(query);

        const matchesYear = !selectedYear || (date && date.getFullYear().toString() === selectedYear);
        const matchesMonth = selectedMonth === "" || (date && date.getMonth().toString() === selectedMonth);

        return matchesQuery && matchesYear && matchesMonth;
    });

    filteredCircolari.sort((a, b) => {
        const dateA = a.pubDate ? new Date(a.pubDate) : new Date(0);
        const dateB = b.pubDate ? new Date(b.pubDate) : new Date(0);

        return sortOrder === 'asc' ? (dateA - dateB) : (dateB - dateA);
    });

    renderCurrentPage();
}

function renderCurrentPage() {
    const container = document.getElementById('circolari-grid');
    const countSpan = document.getElementById('resultsCount');
    const bottomBar = document.getElementById('bottomPaginationBar');

    const totalItems = filteredCircolari.length;
    const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
    const pageItems = filteredCircolari.slice(startIndex, endIndex);

    if (totalItems > 0) {
        countSpan.textContent = `Mostrate ${startIndex + 1}-${endIndex} di ${totalItems} circolari`;
        bottomBar.style.display = 'flex';
    } else {
        countSpan.textContent = `Trovate 0 circolari`;
        bottomBar.style.display = 'none';
    }

    updatePaginationControls(totalPages);

    if (pageItems.length === 0) {
        container.innerHTML = '<p class="error-msg">Nessuna circolare corrisponde ai criteri di ricerca selezionati.</p>';
        return;
    }

    container.innerHTML = pageItems.map(item => {
        const date = item.pubDate ? new Date(item.pubDate) : null;
        const dateFormatted = date ? date.toLocaleDateString('it-IT', {
            day: 'numeric', month: 'long', year: 'numeric'
        }) : '';

        return `
            <article class="card">
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="card-title">${item.title}</a>
                <div class="card-meta">🗓️ ${dateFormatted}</div>
                <div class="card-desc">${item.description}</div>
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="card-link">Leggi circolare completa &rarr;</a>
            </article>
        `;
    }).join('');
}

function updatePaginationControls(totalPages) {
    const isPrevDisabled = currentPage === 1;
    const isNextDisabled = currentPage === totalPages || totalPages === 0;
    const textIndicator = `Pagina ${currentPage} di ${totalPages}`;

    document.getElementById('prevBtnTop').disabled = isPrevDisabled;
    document.getElementById('nextBtnTop').disabled = isNextDisabled;
    document.getElementById('pageIndicatorTop').textContent = textIndicator;

    document.getElementById('prevBtnBottom').disabled = isPrevDisabled;
    document.getElementById('nextBtnBottom').disabled = isNextDisabled;
    document.getElementById('pageIndicatorBottom').textContent = textIndicator;
}

function changePage(direction) {
    currentPage += direction;
    renderCurrentPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('yearSelect').value = '';
    document.getElementById('monthSelect').value = '';
    document.getElementById('sortSelect').value = 'desc';
    currentPage = 1;
    applyFilters();
}

document.addEventListener('DOMContentLoaded', () => {
    initClock();
    loadArchive();
});
</script>
