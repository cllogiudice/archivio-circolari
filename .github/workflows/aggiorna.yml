name: Aggiorna Archivio Circolari

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install requests beautifulsoup4

      - name: Esegui script di scraping
        run: |
          python generate_db.py

      - name: Commit e push modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add circolari.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico circolari" && git push)
